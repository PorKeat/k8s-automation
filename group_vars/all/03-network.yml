# ==============================================================================
# 3. NETWORK CONFIGURATION
# ==============================================================================

# --- CNI PLUGIN ---
# The CNI plugin that handles pod-to-pod communication.
# Options: calico, cilium, flannel, kube-router, kube-ovn
kube_network_plugin: calico

# Ensure Calico binds to our WireGuard interface automatically
calico_ip_auto_method: "interface=wg0"

# --- IP ALLOCATION (CIDRs) ---
# Subnet assigned to individual pods
kube_pods_subnet: 10.233.64.0/18
# Subnet assigned to cluster services (ClusterIPs)
kube_service_addresses: 10.233.0.0/18

# --- KUBE-PROXY ---
# Proxy mode configuration. Options: ipvs, iptables, nftables
kube_proxy_mode: ipvs
# Must be set to true if using MetalLB or Kube-VIP ARP
kube_proxy_strict_arp: false

# --- DNS RESOLUTION ---
# Options: coredns, coredns_dual, manual, none
dns_mode: coredns
# Options: docker_dns, host_resolvconf, none
resolvconf_mode: host_resolvconf

# --- MULTUS (Multi-Networking) ---
# Setting multi_networking to true will install Multus CNI
kube_network_plugin_multus: false
