# ==============================================================================
# 4. KUBERNETES ADD-ONS
# ==============================================================================
# Simply toggle these switches to true/false to automatically install popular Helm charts and tools.

# --- Core Tools ---
helm_enabled: true
metrics_server_enabled: true
dashboard_enabled: true

# --- Ingress Controllers & Networking ---
ingress_nginx_enabled: true
ingress_alb_enabled: false
gateway_api_enabled: false
metallb_enabled: false
kube_vip_enabled: false

# --- Certificate Management ---
cert_manager_enabled: true

# --- Continuous Delivery ---
argocd_enabled: true

# --- Storage Provisioners ---
local_path_provisioner_enabled: true
local_volume_provisioner_enabled: false

# --- Miscellaneous ---
registry_enabled: false
node_feature_discovery_enabled: false

# ==============================================================================
# POST-INSTALL HELM APPS
# ==============================================================================
# These massive, enterprise-grade tools are automatically deployed via Helm 
# immediately after the cluster finishes booting.

longhorn_enabled: true
prometheus_grafana_enabled: true
thanos_enabled: false
