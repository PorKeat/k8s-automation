---
- name: Pre-Flight Validations
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: preflight_checks
      tags: ['preflight']

- name: End-to-End Kubernetes Cluster Automation (Provisioning)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: provision_gcp
      tags: ['provision']

- name: Refresh Inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Reload the dynamic inventory
      meta: refresh_inventory

- name: Setup WireGuard Mesh Network
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: wireguard_mesh
      tags: ['wireguard']

- name: Trigger Kubespray Installation/Scaling
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: kubespray_trigger
      tags: ['kubespray']

- name: Post-Installation Helm Apps (Longhorn, Prometheus, Thanos)
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - role: post_install_apps
      tags: ['helm']
