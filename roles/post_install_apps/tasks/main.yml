---
- name: Add Longhorn Helm Repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
  when: longhorn_enabled | bool

- name: Deploy Longhorn via Helm
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: longhorn-system
    create_namespace: true
    state: present
  when: longhorn_enabled | bool

- name: Add Prometheus Community Helm Repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  when: prometheus_grafana_enabled | bool or thanos_enabled | bool

- name: Deploy Kube-Prometheus-Stack (Prometheus, Grafana, Alertmanager)
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: true
    state: present
  when: prometheus_grafana_enabled | bool

- name: Deploy Thanos
  kubernetes.core.helm:
    name: thanos
    chart_ref: prometheus-community/prometheus-thanos
    release_namespace: monitoring
    create_namespace: true
    state: present
  when: thanos_enabled | bool
