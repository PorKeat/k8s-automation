---
- name: Install WireGuard
  apt:
    name: wireguard
    state: present
    update_cache: yes

- name: Generate WireGuard private key
  shell: wg genkey
  register: wg_private_key
  changed_when: false
  no_log: true

- name: Extract WireGuard public key
  shell: echo "{{ wg_private_key.stdout }}" | wg pubkey
  register: wg_public_key
  changed_when: false

- name: Template WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: 0600
  notify:
    - Restart WireGuard

- name: Ensure WireGuard is started and enabled
  systemd:
    name: wg-quick@wg0
    state: started
    enabled: yes
